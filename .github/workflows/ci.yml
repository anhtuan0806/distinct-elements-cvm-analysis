name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with pytest
        run: |
          pytest

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Conventional Commits
        run: |
          python -c '
          import subprocess, sys, re

          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          res = subprocess.check_output(["git", "log", "--no-merges", "--format=%s", f"{base}..{head}"]).decode().strip()
          pattern = re.compile(r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\-\/]+\))?: .+$")

          errors = []
          for msg in res.split("\n"):
              msg = msg.strip()
              if not msg or msg.startswith("Merge ") or msg.startswith("Merge:"):
                  continue
              if not pattern.match(msg):
                  errors.append(msg)

          if errors:
              print("❌ The following commit messages do not follow Conventional Commits:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)
          print("✅ All commit messages conform to Conventional Commits!")
          '